<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузчик видео</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c20, #15102a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .wrapper {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { font-size: 26px; margin-bottom: 8px; color: #00d2c4; }
        p { font-size: 14px; color: #b5b5c3; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #2d254e;
            border-radius: 10px;
            background: #0b0819;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        input:focus { border-color: #00d2c4; outline: none; box-shadow: 0 0 10px rgba(0, 210, 196, 0.2); }
        button {
            width: 100%;
            padding: 14px;
            background: #00d2c4;
            color: #0b0819;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #00b3a6; }
        button:disabled { background: #4a3b68; cursor: not-allowed; color: #aaa; }
        .status { display: none; margin-top: 15px; color: #ffc107; font-size: 14px; line-height: 1.4; }
        .result-box { margin-top: 25px; display: none; padding: 15px; background: rgba(78, 240, 165, 0.1); border-radius: 10px; border: 1px solid #4ef0a5; }
        .result-box a {
            display: inline-block;
            padding: 12px 25px;
            background: #4ef0a5;
            color: #0b0819;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }
        .result-box a:hover { background: #3cd491; box-shadow: 0 0 15px rgba(78, 240, 165, 0.4); }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Загрузчик видео</h1>
    <p>Вставь ссылку сюда (YouTube, TikTok, Instagram и др.):</p>
    
    <input type="text" id="linkInput" placeholder="Вставьте ссылку на ролик...">
    <button id="actionBtn" onclick="processVideo()">Скачать</button>

    <div class="status" id="statusMessage">Ищем видео на сервере...</div>
    
    <div class="result-box" id="successBlock">
        <span style="color: #4ef0a5; font-weight: 600; display: block;">Видео успешно найдено!</span>
        <a id="downloadLink" href="#" target="_blank">ОТКРЫТЬ И СКАЧАТЬ ВИДЕО</a>
    </div>
</div>

<script>
// Список доступных серверов-зеркал
const apiEndpoints = [
    'https://cobalt.tools',
    'https://unblockninja.com',
    'https://wuk.sh'
];

async function processVideo() {
    const inputField = document.getElementById('linkInput');
    const actionBtn = document.getElementById('actionBtn');
    const statusMsg = document.getElementById('statusMessage');
    const successBlock = document.getElementById('successBlock');
    const downloadLink = document.getElementById('downloadLink');

    const userUrl = inputField.value.trim();

    if (!userUrl) {
        alert('Пожалуйста, вставьте ссылку!');
        return;
    }

    actionBtn.disabled = true;
    statusMsg.style.display = 'block';
    successBlock.style.display = 'none';
    
    let success = false;

    // Перебираем серверы по очереди, пока один не сработает
    for (let i = 0; i < apiEndpoints.length; i++) {
        statusMsg.innerText = `Пытаемся скачать через сервер ${i + 1}...`;
        try {
            const response = await fetch(apiEndpoints[i], {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    url: userUrl,
                    videoQuality: "720"
                })
            });

            const resultData = await response.json();

            if (resultData && resultData.url) {
                downloadLink.href = resultData.url;
                statusMsg.style.display = 'none';
                successBlock.style.display = 'block';
                success = true;
                break; // Выходим из цикла, так как видео найдено
            }
        } catch (err) {
            console.log(`Сервер ${i + 1} временно недоступен, пробуем следующий...`);
        }
    }

    if (!success) {
        statusMsg.innerHTML = '<span style="color:#ff4a4a;">Все серверы сейчас перегружены.<br>Пожалуйста, попробуй нажать кнопку еще раз через 15 секунд!</span>';
    }
    
    actionBtn.disabled = false;
}
</script>

</body>
</html>
